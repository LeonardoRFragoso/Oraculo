[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --maxfail=10

markers =
    integration: requires external services (DB, LLM APIs)
    unit: pure unit tests, no I/O
    slow: tests taking > 1 second

[coverage:run]
source =
    api
    catalog
    connectors
    nl2sql
    rag
    analyst
    actions
    graph
    core
    db
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    src/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 60
